name: Build and Release

# Pushing a version tag (1.0.0, 1.0.1, ...) builds the extension, packs it with Playnite's
# Toolbox and publishes a GitHub release with the .pext attached. The tag must match Version
# in extension.yaml and RomM.csproj (the tests check those two agree).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Compiler toolset
        run: dotnet add RomM.csproj package Microsoft.Net.Sdk.Compilers.Toolset --version 9.0.300

      # The same build as a local one (DEVELOPMENT.md).
      - name: Build
        run: msbuild RomM.csproj /restore /p:Configuration=Release /p:Platform="AnyCPU" /p:CopyLocalLockFileAssemblies=true

      - name: Setup Playnite (for its Toolbox)
        run: |
          Invoke-WebRequest -Uri "https://github.com/JosefNemec/Playnite/releases/download/10.35/Playnite1035.zip" -OutFile "Playnite.zip"
          Expand-Archive "Playnite.zip" -DestinationPath "Playnite"

      - name: Pack
        run: |
          .\tools\pack.ps1 -Toolbox "Playnite\Toolbox.exe"
          Get-ChildItem .\PackingOutput

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomMnite
          path: PackingOutput/*.pext

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RomMnite ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: PackingOutput/*.pext
