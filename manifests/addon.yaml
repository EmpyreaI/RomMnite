Type: GameLibrary
Name: RomMnite
Author: Empyreai
ShortDescription: A Steam-like Playnite for your RomM server - library, store, emulators and cloud saves
InstallerManifestUrl: https://raw.githubusercontent.com/Empyreai/RomMnite/main/manifests/installer.yaml
SourceUrl: https://github.com/Empyreai/RomMnite
Description: |
  RomMnite, created by Empyreai, turns Playnite into a Steam-like home for your RomM server: your library, a store to browse the server, emulators set up for you, cloud saves, achievements and an in-game overlay.

  Based on the RomM Library Importer by The RomM Team (https://github.com/rommapp/playnite-plugin).

  Installing a game in Playnite will download it from RomM and store it on your system, allowing you to launch it in your emulator of choice.
Tags: [romm, emulation, retro]
